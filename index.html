<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Arcade // b1scu1td3stroy3r</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }
    body {
      background: #050807;
      color: #00ff66;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }
    .crt::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 100;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }
    .hub-container {
      width: 100%;
      max-width: 860px;
      border: 1px solid #00ff66;
      background: #021107;
      padding: 24px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
    }
    header {
      border-bottom: 1px solid #004422;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .badge-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .badge-btn {
      background: #001a0a;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 4px 10px;
      text-decoration: none;
      font-size: 11px;
      transition: all 0.2s ease;
    }
    .badge-btn:hover {
      background: #00ff66;
      color: #050807;
      font-weight: bold;
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin-top: 10px;
    }
    .game-card {
      border: 1px solid #00aa44;
      background: #000c05;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .game-card:hover {
      border-color: #00ff66;
      box-shadow: 0 0 16px rgba(0, 255, 102, 0.35);
      transform: translateY(-2px);
    }
    .game-card.disabled {
      border-color: #22382a;
      opacity: 0.55;
      cursor: not-allowed;
    }
    .game-card.disabled:hover {
      transform: none;
      box-shadow: none;
    }
    .status-tag {
      font-size: 10px;
      padding: 2px 6px;
      align-self: flex-start;
      margin-bottom: 10px;
      border: 1px solid currentColor;
      border-radius: 2px;
      font-weight: bold;
    }
    .status-active { color: #00ff66; border-color: #00ff66; }
    .status-wip { color: #ffaa00; border-color: #ffaa00; }
    .game-title {
      font-size: 17px;
      margin-bottom: 8px;
      color: #00ffcc;
    }
    .game-desc {
      font-size: 12px;
      color: #88ffb3;
      line-height: 1.4;
      margin-bottom: 16px;
    }
    .launch-btn {
      font-size: 12px;
      font-weight: bold;
      color: #00ff66;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
