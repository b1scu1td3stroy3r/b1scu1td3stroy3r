<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>B1SCU1T FIGHTER // Arcade Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body {
      background: #050807;
      color: #00ff66;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 8px;
      user-select: none;
      touch-action: manipulation;
    }
    .crt::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 100, 0.03), rgba(0, 255, 100, 0.01), rgba(0, 100, 255, 0.03));
      z-index: 10;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none !important;
    }
    .game-container {
      width: 100%;
      max-width: 680px;
      border: 1px solid #00ff66;
      background: #021107;
      padding: 16px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    header {
      width: 100%;
      border-bottom: 1px solid #004422;
      padding-bottom: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    h1 {
      font-size: 18px;
      letter-spacing: 1.5px;
      color: #00ff66;
      text-shadow: 0 0 6px #00ff66;
    }
    .badge-bar {
      display: flex;
      gap: 8px;
    }
    .badge-btn {
      background: #001a0a;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 4px 10px;
      text-decoration: none;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-block;
    }
    .badge-btn:hover {
      background: #00ff66;
      color: #050807;
      font-weight: bold;
    }

    /* HUD Health Bars */
    .hud {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      background: #000c05;
      border: 1px solid #005522;
      padding: 10px 14px;
      margin-bottom: 10px;
      align-items: center;
    }
    .fighter-hud {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .fighter-hud.right {
      text-align: right;
    }
    .hud-name {
      font-size: 11px;
      font-weight: bold;
      color: #00ffcc;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hp-bar-bg {
      width: 100%;
      height: 14px;
      background: #20050b;
      border: 1px solid #ff3366;
      position: relative;
      overflow: hidden;
    }
    .hp-bar-fill {
      height: 100%;
      background: #00ff66;
      width: 100%;
      transition: width 0.15s ease-out;
      box-shadow: 0 0 8px #00ff66;
    }
    .hp-bar-fill.danger {
      background: #ff3366;
      box-shadow: 0 0 8px #ff3366;
    }
