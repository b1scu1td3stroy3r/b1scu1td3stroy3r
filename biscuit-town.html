<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biscuit Quest // Pallet Town</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #111413;
      color: #9bbc0f;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .gb-chassis {
      background: #8b8f97;
      width: 360px;
      padding: 24px 22px 34px 22px;
      border-radius: 14px 14px 45px 14px;
      box-shadow: 0 16px 30px rgba(0,0,0,0.7), inset 0 2px 4px #b8bcc4, inset -3px -3px 6px #5e626b;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .gb-bezel {
      background: #6a6f7b;
      width: 100%;
      padding: 18px 18px 14px 18px;
      border-radius: 8px 8px 30px 8px;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .bezel-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 8px;
      color: #8f95a3;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .battery-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 7px;
      color: #b52222;
    }
    .battery-dot {
      width: 7px;
      height: 7px;
      background: #ff2222;
      border-radius: 50%;
      box-shadow: 0 0 5px #ff2222;
    }

    .screen-wrapper {
      position: relative;
      border: 3px solid #20242b;
      border-radius: 4px;
      background: #8b956d;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      width: 280px;
      height: 252px;
      background: #8bac0f;
    }

    .controls-deck {
      width: 100%;
      margin-top: 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .dpad {
      display: grid;
      grid-template-columns: 28px 28px 28px;
      grid-template-rows: 28px 28px 28px;
      width: 84px;
      height: 84px;
    }
    .dpad-btn {
      background: #1c1d20;
      box-shadow: inset 0 1px 2px #444, 0 3px 2px rgba(0,0,0,0.5);
      cursor: pointer;
      border: none;
      outline: none;
    }
    .dpad-btn:active {
      background: #0d0e10;
      box-shadow: inset 0 2px 3px #000;
    }
    .dpad-up { grid-column: 2; grid-row: 1; border-radius: 4px 4px 0 0; }
    .dpad-left { grid-column: 1; grid-row: 2; border-radius: 4px 0 0 4px; }
    .dpad-center { grid-column: 2; grid-row: 2; background: #1c1d20; pointer-events: none; }
    .dpad-right { grid-column: 3; grid-row: 2; border-radius: 0 4px 4px 0; }
    .dpad-down { grid-column: 2; grid-row: 3; border-radius: 0 0 4px 4px; }

    .retro-branding {
      position: absolute;
      left: 102px;
      bottom: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-style: italic;
      user-select: none;
      pointer-events: none;
    }
    .brand-main {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 13px;
      font-weight: 900;
      color: #24296b;
      letter-spacing: -0.5px;
      text-shadow: 0.5px 0.5px 0px #fff;
    }
    .brand-sub {
      font-family: 'Arial', sans-serif;
      font-size: 8px;
      font-weight: 900;
      color: #8c1d40;
      letter-spacing: 1.5px;
      margin-top: -2px;
    }

    .action-cluster {
      display: flex;
      gap: 14px;
      transform: rotate(-24deg);
      margin-right: 6px;
    }
    .btn-action-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .btn-action {
      width: 36px;
      height: 36px;
      background: #8e1846;
      border-radius: 50%;
      box-shadow: inset 0 2px 2px #d43b74, 0 3px 4px rgba(0,0,0,0.5);
      border: none;
      cursor: pointer;
      color: #fff;
      font-weight: bold;
      font-size: 13px;
    }
    .btn-action:active {
      background: #5b0f2c;
      box-shadow: inset 0 2px 3px #000;
      transform: translateY(1px);
    }
    .btn-label {
      font-size: 9px;
      color: #24296b;
      font-weight: 900;
      margin-top: 4px;
    }

    .meta-cluster {
      display: flex;
      gap: 18px;
      margin-top: 30px;
    }
    .meta-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .meta-btn {
      width: 38px;
      height: 10px;
      background: #62656d;
      border-radius: 6px;
      transform: rotate(-28deg);
      box-shadow: inset 0 1px 2px #888, 0 2px 3px rgba(0,0,0,0.4);
      border: none;
      cursor: pointer;
    }
    .meta-btn:active { background: #3d3e42; }
    .meta-label {
      font-size: 8px;
      color: #24296b;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-top: 10px;
      transform: rotate(-28deg);
    }

    .exit-bar {
      margin-top: 16px;
      font-size: 11px;
    }
    .exit-bar a {
      color: #00ff66;
      text-decoration: none;
    }
    .exit-bar a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="gb-chassis">
    <div class="gb-bezel">
      <div class="bezel-top">
        <div class="battery-indicator">
          <div class="battery-dot"></div>
          <span>BATTERY</span>
        </div>
        <span>DOT MATRIX WITH STEREO SOUND</span>
      </div>

      <div class="screen-wrapper">
        <canvas id="gameCanvas" width="160" height="144"></canvas>
      </div>
    </div>

    <div class="controls-deck">
      <div class="dpad">
        <button class="dpad-btn dpad-up" id="btn-up"></button>
        <button class="dpad-btn dpad-left" id="btn-left"></button>
        <div class="dpad-center"></div>
        <button class="dpad-btn dpad-right" id="btn-right"></button>
        <button class="dpad-btn dpad-down" id="btn-down"></button>
      </div>

      <div class="retro-branding">
        <span class="brand-main">B1SCU1T</span>
        <span class="brand-sub">BOY™</span>
      </div>

      <div class="action-cluster">
        <div class="btn-action-wrapper">
          <button class="btn-action" id="btn-b">B</button>
          <span class="btn-label">B</span>
        </div>
        <div class="btn-action-wrapper">
          <button class="btn-action" id="btn-a">A</button>
          <span class="btn-label">A</span>
        </div>
      </div>
    </div>

    <div class="meta-cluster">
      <div class="meta-btn-wrap">
        <button class="meta-btn" id="btn-select"></button>
        <span class="meta-label">SELECT</span>
      </div>
      <div class="meta-btn-wrap">
        <button class="meta-btn" id="btn-start"></button>
        <span class="meta-label">START</span>
      </div>
    </div>
  </div>

  <div class="exit-bar">
    <a href="index.html">&larr; Return to Arcade Hub</a>
  </div>
