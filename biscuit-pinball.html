<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadbury Cadet: Biscuit Pinball // Arcade Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body {
      background: #050807;
      color: #00ff66;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 8px;
      user-select: none;
      touch-action: manipulation;
    }
    .crt::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 100, 0.03), rgba(0, 255, 100, 0.01), rgba(0, 100, 255, 0.03));
      z-index: 90;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none !important;
    }
    .game-container {
      width: 100%;
      max-width: 580px;
      border: 1px solid #00ff66;
      background: #021107;
      padding: 16px;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 100;
    }
    header {
      width: 100%;
      border-bottom: 1px solid #004422;
      padding-bottom: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    h1 {
      font-size: 18px;
      letter-spacing: 1.5px;
      color: #00ff66;
      text-shadow: 0 0 6px #00ff66;
    }
    .badge-bar {
      display: flex;
      gap: 8px;
    }
    .badge-btn {
      background: #001a0a;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 4px 10px;
      text-decoration: none;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .badge-btn:hover {
      background: #00ff66;
      color: #050807;
      font-weight: bold;
    }

    /* Scoreboard */
    .scoreboard {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: #000c05;
      border: 1px solid #005522;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .stat-box span {
      color: #88ffb3;
      display: block;
      font-size: 10px;
      text-transform: uppercase;
    }
    .stat-box strong {
      font-size: 15px;
      color: #00ffcc;
    }

    /* Canvas Frame */
    .canvas-wrapper {
      position: relative;
      background: #010904;
      border: 2px solid #00aa44;
      box-shadow: inset 0 0 20px rgba(0, 255, 102, 0.15);
    }
    canvas {
      display: block;
      background: transparent;
    }

    /* Mobile On-Screen Controls */
    .touch-controls {
      width: 100%;
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .touch-btn {
      background: #00220e;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 14px 6px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.15);
      border-radius: 4px;
      touch-action: none;
    }
    .touch-btn:active, .touch-btn.pressed {
      background: #00ff66;
      color: #021107;
    }
    .touch-btn-both {
      grid-column: span 3;
      padding: 10px;
      background: #001509;
      border-color: #00aa44;
    }

    /* Modal / Instructions Overlay */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 10, 6, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      border: 1px solid #00ff66;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.3);
      z-index: 200;
    }
    .overlay h2 {
      font-size: 20px;
      letter-spacing: 1px;
      color: #00ff66;
      margin-bottom: 12px;
      text-shadow: 0 0 8px #00ff66;
    }
    .overlay p {
      font-size: 11px;
      color: #88ffb3;
      line-height: 1.6;
      margin-bottom: 12px;
      max-width: 420px;
    }
    .key-table {
      margin: 12px 0 18px 0;
      font-size: 11px;
      border-collapse: collapse;
      width: 100%;
      max-width: 380px;
    }
    .key-table td {
      border: 1px solid #005522;
      padding: 6px 10px;
      text-align: left;
    }
    .key-table td:first-child {
      color: #00ffcc;
      font-weight: bold;
    }
  </style>
</head>

      </div>
      <div class="badge-bar">
