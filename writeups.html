<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Research & Write-ups // b1scu1td3stroy3r</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body {
      background: #050807;
      color: #00ff66;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .crt::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 100, 0.03), rgba(0, 255, 100, 0.01), rgba(0, 100, 255, 0.03));
      z-index: 100;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }
    .hub-container {
      width: 100%;
      max-width: 900px;
      border: 1px solid #00ff66;
      background: #021107;
      padding: 24px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
    }
    header {
      border-bottom: 1px solid #004422;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .badge-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .badge-btn {
      background: #001a0a;
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 4px 10px;
      text-decoration: none;
      font-size: 11px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .badge-btn:hover, .badge-btn.active {
      background: #00ff66;
      color: #050807;
      font-weight: bold;
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    /* Write-up Entry Cards */
    .entry-card {
      border: 1px solid #00aa44;
      background: #000c05;
      padding: 16px;
      margin-bottom: 14px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .entry-card:hover {
      border-color: #00ff66;
      box-shadow: 0 0 12px rgba(0, 255, 102, 0.25);
      transform: translateX(4px);
    }
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .entry-title {
      font-size: 15px;
      color: #00ffcc;
      font-weight: bold;
    }
    .entry-date {
      font-size: 11px;
      color: #88ffb3;
    }
    .tag {
      font-size: 9px;
      padding: 2px 5px;
      border: 1px solid #00ff66;
      border-radius: 2px;
      margin-right: 6px;
      text-transform: uppercase;
    }
    .tag-ctf { border-color: #ff3366; color: #ff3366; }

    .entry-desc {
      font-size: 12px;
      color: #88ffb3;
      line-height: 1.4;
      margin-top: 6px;
    }

    .exit-bar {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #004422;
      font-size: 11px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .exit-bar a { color: #00ff66; text-decoration: none; }
    .exit-bar a:hover { text-decoration: underline; }
  </style>
</head>
<body class="crt">
  <div class="hub-container">
    <header>
      <h1 style="font-size: 20px; letter-spacing: 1px;">OPERATOR RESEARCH ARCHIVE // WRITE-UPS</h1>
      <p style="font-size: 12px; color: #88ffb3; margin-top: 4px;">
        Terence White [b1scu1td3stroy3r] // CTF Deconstructions &amp; Security Walkthroughs
      </p>

      <div class="badge-bar">
        <a class="badge-btn" href="https://github.com/b1scu1td3stroy3r" target="_blank">🐙 GitHub Profile</a>
        <a class="badge-btn" href="https://app.hackthebox.com/public/users/2571595" target="_blank">🚩 Hack The Box</a>
        <a class="badge-btn" href="https://ctftime.org/user/237405" target="_blank">⏱️ CTFtime</a>
        <a class="badge-btn" href="https://www.credly.com/users/terence-white.764e5c8e" target="_blank">📜 Credly</a>
        <a class="badge-btn" href="https://www.codecademy.com/users/b1scu1td3stroy3r/achievements" target="_blank">💻 Codecademy</a>
        <a class="badge-btn" href="arcade.html">🕹️ Arcade Hub</a>
      </div>
    </header>

    <!-- Category Filters -->
    <div class="filter-bar">
      <button class="badge-btn active" onclick="filterCategory('ALL', this)">[ ALL REPORTS ]</button>
      <button class="badge-btn" onclick="filterCategory('CTF', this)">🚩 CTF Walkthroughs</button>
    </div>

    <!-- Article List Container -->
    <div id="articlesList"></div>

    <div class="exit-bar">
      <a href="https://github.com/b1scu1td3stroy3r" target="_blank">&larr; Return to GitHub Profile</a>
      <span>|</span>
      <a href="arcade.html">&larr; Return to Arcade Hub</a>
      <span>|</span>
      <a href="touch.html">🚩 Direct Link: HTB Touch Walkthrough &rarr;</a>
    </div>
  </div>

  <script>
    const WRITEUPS = [
      {
        url: "touch.html",
        category: "CTF",
        tag: "tag-ctf",
        categoryLabel: "HTB Walkthrough",
        title: "Hack The Box: Touch — Kiosk Breakout & Peripheral State Exploitation",
        date: "2026-03",
        summary: "A complete walkthrough of the Touch lab: unauthenticated hardware API enumeration, peripheral toggling, escaping Windows Kiosk mode via Edge dialogues, and MySQL privilege auditing."
      }
    ];

    let activeFilter = 'ALL';

    function renderArticles() {
      const container = document.getElementById('articlesList');
      container.innerHTML = '';

      const filtered = activeFilter === 'ALL' 
        ? WRITEUPS 
        : WRITEUPS.filter(w => w.category === activeFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color: #88ffb3; font-size: 12px;">No write-ups found for this category filter.</p>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'entry-card';
        card.onclick = function() { window.location.href = item.url; };
        card.innerHTML = 
          '<div class="entry-header">' +
            '<div>' +
              '<span class="tag ' + item.tag + '">' + item.categoryLabel + '</span>' +
              '<span class="entry-title">' + item.title + '</span>' +
            '</div>' +
            '<span class="entry-date">[' + item.date + ']</span>' +
          '</div>' +
          '<p class="entry-desc">' + item.summary + '</p>';
        container.appendChild(card);
      });
    }

    function filterCategory(cat, btn) {
      activeFilter = cat;
      document.querySelectorAll('.filter-bar .badge-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderArticles();
    }

    renderArticles();
  </script>
</body>
</html>
